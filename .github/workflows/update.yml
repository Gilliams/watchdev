name: Mise à jour quotidienne (veille + résumé + cotations)

# Deux passages par jour, heures UTC :
#   05:30 -> ~06:30 (hiver) / 07:30 (été) à Paris : tout est frais pour la lecture du matin,
#            cotations incluant la clôture US de la veille.
#   21:15 -> après la clôture de Wall Street (20:00 UTC en été, 21:00 en hiver).
# Un seul job, un seul commit : 2 déploiements Pages par jour au lieu de 10.
on:
  schedule:
    - cron: '30 5 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devwatch-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Veille RSS
        run: npm run fetch-feeds

      - name: Résumé « actu en 5 min »
        run: npm run build-digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}

      - name: Cotations
        # continue-on-error : une source financière indisponible ne doit pas priver
        # le site de sa veille et de son résumé du jour
        continue-on-error: true
        run: npm run fetch-quotes
        env:
          CRYPTO_VS: ${{ vars.CRYPTO_VS || 'eur' }}

      - name: Commit des données si changement
        run: |
          git config user.name 'devwatch-bot'
          git config user.email 'actions@github.com'
          git add public/data/articles.json public/data/digest.json public/data/quotes.json
          git diff --cached --quiet || git commit -m 'chore: mise à jour veille, résumé et cotations'
          git push
